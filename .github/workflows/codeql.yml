name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'

# Set read-only permissions by default
permissions: read-all

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    # Grant write permissions only to this job
    permissions:
      security-events: write  # Upload SARIF results to GitHub Security
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9  # v3
        with:
          languages: python
          # Queries: security-extended includes all security checks
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9  # v3
        with:
          category: "/language:python"
